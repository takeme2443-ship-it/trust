<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Statements | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @media print {
            body { background: white; padding: 0; }
            #header-container, #nav-container, #controls { display: none !important; }
            #printable-area { display: block !important; padding: 40px; }
            .tb-table { border: 1px solid #eee; }
        }
    </style>
</head>
<body class="bg-slate-50 pb-32">
    <div id="header-container"></div>
    
    <main class="max-w-md mx-auto px-6 pt-8">
        <div id="controls" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 text-center space-y-6">
            <i class="fa-solid fa-file-invoice-dollar text-4xl text-[#D4AF37]"></i>
            <h2 class="text-xl font-black text-[#002147]">Generate Statement</h2>
            <div class="text-left space-y-4">
                <div>
                    <label>Start Date</label>
                    <input type="date" id="start-date" class="w-full">
                </div>
                <div>
                    <label>End Date</label>
                    <input type="date" id="end-date" class="w-full">
                </div>
            </div>
            <button id="generate-btn" class="w-full btn-primary h-14">View & Print Statement</button>
        </div>

        <!-- Hidden printable result -->
        <div id="printable-area" class="hidden bg-white min-h-screen">
            <div class="flex justify-between items-center mb-10 border-b pb-6">
                <div>
                    <h1 class="text-2xl font-black text-[#002147]">TRUST BANK</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Official E-Statement</p>
                </div>
                <div class="text-right">
                    <p id="client-name" class="font-black text-sm text-[#002147]"></p>
                    <p id="statement-range" class="text-[9px] text-slate-500 font-bold"></p>
                </div>
            </div>

            <table class="w-full text-left">
                <thead>
                    <tr class="text-[10px] font-black text-slate-400 border-b">
                        <th class="py-4">DATE</th>
                        <th class="py-4">DESCRIPTION</th>
                        <th class="py-4">TYPE</th>
                        <th class="py-4 text-right">AMOUNT</th>
                    </tr>
                </thead>
                <tbody id="statement-body">
                    <!-- Rows populate here -->
                </tbody>
            </table>

            <div class="mt-20 text-center text-[9px] text-slate-300 font-black uppercase tracking-widest">
                This document is a certified digital record. End of statement.
            </div>
        </div>
    </main>

    <div id="nav-container"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { renderHeader, renderBottomNav } from './components.js';
        import { formatCurrency, formatDate } from './utils.js';

        document.getElementById('header-container').innerHTML = renderHeader('E-Statements', true);
        document.getElementById('nav-container').innerHTML = renderBottomNav('settings');

        document.getElementById('generate-btn').onclick = async () => {
            const user = auth.currentUser;
            const start = new Date(document.getElementById('start-date').value);
            const end = new Date(document.getElementById('end-date').value);
            if (isNaN(start) || isNaN(end)) return alert("Please select dates");

            // Normalize end date to end of day
            end.setHours(23, 59, 59, 999);

            // Fetch Transactions Only (Approved Ledger)
            const snap = await getDocs(query(collection(db, "transactions"), where("uid", "==", user.uid)));
            
            const results = snap.docs
                .map(d => ({ ...d.data(), date: d.data().timestamp?.toDate() }))
                .filter(t => t.date >= start && t.date <= end)
                .sort((a, b) => b.date - a.date);

            document.getElementById('client-name').innerText = user.displayName || "Valued Client";
            document.getElementById('statement-range').innerText = `${start.toLocaleDateString()} - ${end.toLocaleDateString()}`;
            
            const body = document.getElementById('statement-body');
            body.innerHTML = results.length > 0 ? results.map(t => `
                <tr class="border-b text-[11px]">
                    <td class="py-4 font-bold text-slate-400">${t.date.toLocaleDateString()}</td>
                    <td class="py-4 font-black text-[#002147]">${t.description}</td>
                    <td class="py-4 uppercase font-bold text-slate-400">${t.type}</td>
                    <td class="py-4 text-right font-black ${t.direction === 'credit' ? 'text-emerald-600' : ''}">
                        ${t.direction === 'credit' ? '+' : '-'}${formatCurrency(t.amount)}
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="4" class="py-10 text-center text-slate-400">No transactions in this period.</td></tr>';

            // Print
            window.print();
        };
    </script>
</body>
</html>
