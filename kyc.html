<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Audit | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 pb-20">
    <div id="header-container"></div>
    <main class="max-w-md mx-auto px-6 pt-8">
        <div id="kyc-container" class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden">
            <div id="kyc-status-header" class="p-8 text-center border-b border-slate-100">
                <div id="status-icon" class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-300">
                    <i class="fa-solid fa-id-card text-2xl"></i>
                </div>
                <h2 id="status-title" class="text-xl font-black text-[#002147]">Identity Verification</h2>
                <p id="status-desc" class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Level 1 Security Audit</p>
            </div>

            <form id="kyc-form" class="p-8 space-y-6">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block">Document Category</label>
                    <select id="doc-type" class="w-full bg-transparent border-none font-bold text-[#002147] focus:ring-0">
                        <option>International Passport</option>
                        <option>National ID Card</option>
                        <option>Driver's License</option>
                    </select>
                </div>
                <div class="space-y-4">
                    <div class="relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center">
                        <input type="file" id="kyc-front" class="absolute inset-0 opacity-0" accept="image/*" required>
                        <p class="text-[9px] font-black uppercase text-slate-500">ID Front Side</p>
                    </div>
                    <div class="relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center">
                        <input type="file" id="kyc-back" class="absolute inset-0 opacity-0" accept="image/*" required>
                        <p class="text-[9px] font-black uppercase text-slate-500">ID Back Side</p>
                    </div>
                    <div class="relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center">
                        <input type="file" id="kyc-selfie" class="absolute inset-0 opacity-0" accept="image/*" required>
                        <p class="text-[9px] font-black uppercase text-slate-500">Live Selfie</p>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full btn-primary h-16">Submit for Audit</button>
            </form>
        </div>
    </main>
    <div id="nav-container"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { renderHeader, renderBottomNav } from './components.js';
        import { compressImage } from './utils.js';

        document.getElementById('header-container').innerHTML = renderHeader('Verification', true);
        document.getElementById('nav-container').innerHTML = renderBottomNav('settings');

        auth.onAuthStateChanged(user => {
            if (!user) return;
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                const data = snap.data();
                updateUI(data.kycStatus || 'NONE');
            });
        });

        function updateUI(status) {
            const form = document.getElementById('kyc-form');
            if (status === 'PENDING') {
                form.innerHTML = `<div class="p-10 text-center"><i class="fa-solid fa-clock-rotate-left text-4xl text-amber-500 mb-4 animate-pulse"></i><p class="text-sm font-bold">Audit in progress...</p></div>`;
            } else if (status === 'VERIFIED') {
                document.getElementById('kyc-status-header').classList.add('bg-emerald-50');
                form.innerHTML = `<div class="p-10 text-center"><i class="fa-solid fa-shield-check text-4xl text-emerald-500 mb-4"></i><p class="text-sm font-bold">Identity Verified</p></div>`;
            }
        }

        document.getElementById('kyc-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "Compressing...";
            
            const front = await compressImage(document.getElementById('kyc-front').files[0]);
            const back = await compressImage(document.getElementById('kyc-back').files[0]);
            const selfie = await compressImage(document.getElementById('kyc-selfie').files[0]);

            await setDoc(doc(db, "kyc", auth.currentUser.uid), {
                uid: auth.currentUser.uid, documentType: document.getElementById('doc-type').value,
                documentFront: front, documentBack: back, documentSelfie: selfie,
                status: "PENDING", submittedAt: serverTimestamp()
            });
            await updateDoc(doc(db, "users", auth.currentUser.uid), { kycStatus: "PENDING" });
        };
    </script>
</body>
</html>
