<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUST BANK | MANAGEMENT CONSOLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Public Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .admin-sidebar-item { border-left: 4px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; }
        .admin-sidebar-item.active { background: rgba(212, 175, 55, 0.1); color: #D4AF37; border-left: 4px solid #D4AF37; opacity: 1; }
        
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tb-table th { padding: 16px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; border-bottom: 1px solid #334155; text-align: left; }
        .tb-table td { padding: 16px; font-size: 12px; border-bottom: 1px solid #1e293b; }

        /* DOCUMENT FORGE STYLING */
        .irs-paper { background: white; color: black; padding: 40px; font-family: 'Times New Roman', serif; border: 1px solid #ddd; width: 100%; max-width: 550px; margin: auto; position: relative; }
        .irs-header { border-bottom: 3px solid black; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .official-seal { border: 4px double #002147; color: #002147; padding: 8px; font-weight: 900; transform: rotate(-15deg); text-transform: uppercase; font-size: 10px; text-align: center; line-height: 1; }

        /* FLOATING CHAT DOCK */
        #admin-floating-dock {
            position: fixed; bottom: 20px; right: 20px; width: 380px; height: 500px;
            z-index: 1000; display: none; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 20px;
            overflow: hidden; border: 1px solid #334155; transition: transform 0.3s ease;
        }
        #admin-floating-dock.minimized { transform: translateY(445px); }
        .dock-header { background: #D4AF37; color: #002147; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 12px; }
        .msg-admin { background: #D4AF37; color: #002147; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-user { background: #1e293b; color: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex">

    <!-- Sidebar Navigation -->
    <aside class="w-72 bg-[#020617] border-r border-slate-800 flex flex-col z-50">
        <div class="p-8 border-b border-slate-800">
            <h1 class="font-black text-white tracking-tighter text-xl leading-none">TRUST BANK</h1>
            <p class="text-[9px] font-black text-[#D4AF37] uppercase tracking-[0.3em] mt-1">Management Center</p>
        </div>
        <nav class="flex-1 p-6 space-y-2 overflow-y-auto">
            <button onclick="loadTab('dashboard')" class="admin-sidebar-item active w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-chart-pie w-5"></i> Overview</button>
            <button onclick="loadTab('users')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-users w-5"></i> Account Holders</button>
            <button onclick="loadTab('approvals')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-bolt w-5"></i> Task Queue</button>
            <button onclick="loadTab('forge')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-stamp w-5"></i> Document Forge</button>
            <button onclick="loadTab('supportTickets')" class="admin-sidebar-item w-full flex items-center justify-between p-4 rounded-xl text-sm font-bold">
                <div class="flex items-center gap-4"><i class="fa-solid fa-comment-dots w-5"></i> Live Support</div>
                <span id="global-unread" class="hidden bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse">0</span>
            </button>
            <button onclick="loadTab('ledger')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-terminal w-5"></i> Audit Logs</button>
        </nav>
        <div class="p-6 border-t border-slate-800">
            <button id="logout-btn" class="w-full bg-rose-500/10 text-rose-500 p-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Terminate Session</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative">
        <header class="h-24 bg-[#020617]/80 backdrop-blur-md border-b border-slate-800 flex justify-between items-center px-10 sticky top-0 z-40">
            <h2 id="tab-title" class="font-black uppercase tracking-[0.2em] text-sm text-white">Console</h2>
            <div class="flex items-center gap-6">
                <input type="text" id="admin-search" placeholder="Search Database..." class="bg-slate-900 border border-slate-700 px-6 py-2.5 text-xs rounded-2xl text-white outline-none focus:border-[#D4AF37] transition-all">
                <div class="w-10 h-10 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-center text-slate-400"><i class="fa-solid fa-user-shield"></i></div>
            </div>
        </header>
        <section id="tab-content" class="p-10 overflow-y-auto flex-1"></section>
    </main>

    <!-- PERSISTENT CHAT DOCK -->
    <div id="admin-floating-dock" class="flex flex-col">
        <div class="dock-header" onclick="toggleDock()">
            <div class="flex items-center gap-3">
                <div class="w-6 h-6 bg-[#020617] rounded flex items-center justify-center text-[#D4AF37] text-[10px] font-black" id="dock-initial">?</div>
                <span id="dock-user-name" class="font-black text-[10px] uppercase tracking-widest">Support Line</span>
            </div>
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-minus text-xs"></i>
                <i class="fa-solid fa-xmark text-sm" onclick="closeDock(event)"></i>
            </div>
        </div>
        <div class="flex-1 bg-[#020617] flex flex-col overflow-hidden">
            <div id="dock-msg-flow" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 bg-slate-900/30"></div>
            <div class="p-4 border-t border-slate-800 flex gap-2">
                <input type="text" id="dock-reply-input" placeholder="Enter response..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-[#D4AF37]">
                <button onclick="adminSendReply()" id="dock-send-btn" class="bg-[#D4AF37] text-[#002147] w-10 h-10 rounded-xl flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- KYC Viewer Modal -->
    <div id="kyc-modal" class="hidden fixed inset-0 bg-black/95 z-[1100] flex items-center justify-center p-10 backdrop-blur-xl">
        <div class="bg-[#0f172a] w-full max-w-5xl rounded-[2.5rem] p-12 border border-slate-700 shadow-2xl relative animate-fade">
            <button onclick="closeModal('kyc-modal')" class="absolute top-8 right-8 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-3xl"></i></button>
            <div class="mb-10"><h3 class="font-black text-2xl text-[#D4AF37]">Identity Audit</h3><p id="kyc-user-info" class="text-xs text-slate-400 uppercase mt-2"></p></div>
            <div class="grid grid-cols-3 gap-8">
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Front</label><img id="img-front" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Back</label><img id="img-back" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Selfie</label><img id="img-selfie" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
            </div>
            <div class="mt-12 flex gap-4">
                <button id="kyc-approve" class="flex-1 bg-emerald-600 p-5 rounded-2xl font-black uppercase text-xs">Verify</button>
                <button id="kyc-reject" class="flex-1 bg-rose-600 p-5 rounded-2xl font-black uppercase text-xs">Reject</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, getDocs, where, addDoc, setDoc, increment, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';

        let currentTab = 'dashboard';
        let activeChatUid = null;
        let messagesUnsubscribe = null;
        let users = [];

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            renderData();
        });

        async function logActivity(targetName, action) {
            await addDoc(collection(db, "logs"), {
                targetUser: targetName, action: action, timestamp: serverTimestamp()
            });
        }

        window.loadTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.admin-sidebar-item').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
            });
            document.getElementById('tab-title').innerText = tab.toUpperCase();
            renderData();
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        const renderData = async () => {
            const container = document.getElementById('tab-content');
            container.innerHTML = `<div class="flex items-center justify-center py-40 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-4xl mr-4"></i> Accessing Secure Records...</div>`;

            if (currentTab === 'dashboard') {
                const uSnap = await getDocs(collection(db, "users"));
                const aSnap = await getDocs(collection(db, "accounts"));
                let total = 0; aSnap.forEach(d => total += (d.data().availableBalance || 0));
                
                container.innerHTML = `
                    <div class="grid grid-cols-4 gap-6 animate-fade">
                        <div class="glass-card p-8 rounded-3xl">
                            <p class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Global Liquidity</p>
                            <h3 class="text-3xl font-black text-white">${formatCurrency(total)}</h3>
                        </div>
                        <div class="glass-card p-8 rounded-3xl">
                            <p class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Active Accounts</p>
                            <h3 class="text-3xl font-black text-white">${uSnap.size - 1}</h3>
                        </div>
                    </div>`;
            }

            if (currentTab === 'users') {
                onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), async (snap) => {
                    users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    container.innerHTML = `<div class="glass-card rounded-3xl overflow-hidden animate-fade">
                        <table class="tb-table w-full">
                            <thead><tr><th>Name / Email</th><th>Account ID</th><th>Balance</th><th>PIN</th><th>KYC</th><th class="text-right">Actions</th></tr></thead>
                            <tbody>${users.map(u => {
                                if(u.email === ADMIN_EMAIL) return '';
                                const a = accMap[u.id] || {};
                                return `<tr>
                                    <td><p class="font-black text-white">${u.fullName}</p><p class="text-[10px] text-slate-500 uppercase font-bold">${u.email}</p></td>
                                    <td class="font-mono text-slate-400">${a.accountNumber || '---'}</td>
                                    <td class="text-emerald-400 font-black">${formatCurrency(a.availableBalance || u.balance || 0)}</td>
                                    <td class="text-[#D4AF37] font-bold">${u.securityPin || '----'}</td>
                                    <td><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${u.kycStatus === 'VERIFIED' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-slate-800 text-slate-400'}">${u.kycStatus || 'NONE'}</span></td>
                                    <td class="text-right flex justify-end gap-3">
                                        <button onclick="adminOpenChat('${u.id}', '${u.fullName}')" class="h-8 px-4 bg-slate-800 text-[#D4AF37] rounded-lg text-[9px] font-black uppercase">Chat</button>
                                        <button onclick="adjustBalance('${u.id}', '${u.fullName}')" class="h-8 px-4 bg-[#D4AF37]/10 text-[#D4AF37] rounded-lg text-[9px] font-black uppercase">Adjust</button>
                                    </td>
                                </tr>`;
                            }).join('')}</tbody></table></div>`;
                });
            }

            if (currentTab === 'approvals') {
                container.innerHTML = `<div id="approval-stack" class="grid grid-cols-2 gap-6 animate-fade"></div>`;
                const types = ['deposits', 'withdrawals', 'transfers', 'kyc'];
                types.forEach(type => {
                    onSnapshot(query(collection(db, type), where("status", "==", "PENDING")), snap => {
                        const stack = document.getElementById('approval-stack');
                        snap.docs.forEach(dDoc => {
                            const d = dDoc.data();
                            const card = document.createElement('div');
                            card.className = `glass-card p-8 rounded-[2rem] flex justify-between items-center border-l-4 ${type === 'deposits' ? 'border-emerald-500' : 'border-rose-500'}`;
                            card.innerHTML = `
                                <div>
                                    <p class="text-[10px] font-black text-[#D4AF37] uppercase mb-2 tracking-widest">${type.toUpperCase()} REQUEST</p>
                                    <h3 class="text-2xl font-black text-white">${d.amount ? formatCurrency(d.amount) : 'Identity Audit'}</h3>
                                    <p class="text-[10px] text-slate-500 font-bold mt-2 uppercase">UID: ${dDoc.id.slice(0,10)}...</p>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="processTx('${type}', '${dDoc.id}', 'APPROVED')" class="bg-emerald-600 w-12 h-12 rounded-xl text-white shadow-lg"><i class="fa-solid fa-check"></i></button>
                                    <button onclick="processTx('${type}', '${dDoc.id}', 'DECLINED')" class="bg-rose-600 w-12 h-12 rounded-xl text-white shadow-lg"><i class="fa-solid fa-xmark"></i></button>
                                </div>`;
                            stack.appendChild(card);
                        });
                    });
                });
            }

            if (currentTab === 'forge') {
                container.innerHTML = `
                <div class="grid grid-cols-2 gap-10 animate-fade">
                    <div class="glass-card p-8 rounded-3xl space-y-6">
                        <h3 class="font-black text-[#D4AF37] uppercase text-xs tracking-widest">Document Forge</h3>
                        <div><label class="text-[10px] text-slate-500 font-black uppercase">Recipient</label>
                        <select id="forge-user" class="w-full h-12 bg-slate-900 border border-slate-800 rounded-xl px-4 text-white text-xs">
                            ${users.map(u => `<option value="${u.id}">${u.fullName}</option>`).join('')}
                        </select></div>
                        <div><label class="text-[10px] text-slate-500 font-black uppercase">Document Type</label>
                        <select id="forge-type" class="w-full h-12 bg-slate-900 border border-slate-800 rounded-xl px-4 text-white text-xs">
                            <option value="TAX_CLEARANCE">Federal Tax Clearance (1099-G)</option>
                            <option value="IMF_RELEASE">IMF Release Authorization</option>
                            <option value="COURT_ORDER">Supreme Court Payout Order</option>
                        </select></div>
                        <div><label class="text-[10px] text-slate-500 font-black uppercase">Required Fee ($)</label>
                        <input type="number" id="forge-amt" class="w-full h-12 bg-slate-900 border border-slate-800 rounded-xl px-4 text-white text-xs" placeholder="0.00"></div>
                        <button onclick="previewIRS()" class="w-full h-14 bg-[#D4AF37] text-[#002147] rounded-2xl font-black uppercase text-xs">Generate Official Document</button>
                    </div>
                    <div id="irs-preview-wrap" class="hidden">
                        <div id="irs-capture" class="p-2"><div id="irs-doc" class="irs-paper shadow-2xl">
                            <div class="irs-header">
                                <div><h1 class="font-bold text-[18px]">INTERNAL REVENUE SERVICE</h1><p class="text-[10px]">Department of the Treasury | Washington, DC</p></div>
                                <div class="text-right"><p class="font-bold text-[10px]">Case ID: <span id="irs-c-id"></span></p></div>
                            </div>
                            <div class="my-8"><p class="text-[12px]">ATTN: <span id="irs-c-name" class="font-bold uppercase"></span></p></div>
                            <h2 id="irs-c-title" class="text-center font-black text-[16px] underline my-6"></h2>
                            <p class="text-[13px] leading-relaxed text-justify">
                                This account is currently on <b>Hold</b>. To satisfy federal requirements and authorize the release of funds, you are mandated to settle the <span id="irs-c-reason"></span> fee of <b>$<span id="irs-c-val"></span></b> immediately.
                            </p>
                            <div class="flex justify-between items-end mt-16">
                                <div><p class="font-serif italic border-t border-black w-40 pt-1">Steven Mnuchin</p><p class="font-bold text-[9px] uppercase">Secretary of the Treasury</p></div>
                                <div class="official-seal">TRUST BANK<br>OFFICIAL RELEASE</div>
                            </div>
                        </div></div>
                        <button onclick="downloadIRS()" class="w-full h-14 bg-emerald-600 mt-4 rounded-2xl font-black uppercase text-white">Save JPG Asset</button>
                    </div>
                </div>`;
            }

            if (currentTab === 'ledger') {
                onSnapshot(query(collection(db, "logs"), orderBy("timestamp", "desc"), limit(100)), snap => {
                    container.innerHTML = `<div class="glass-card rounded-3xl p-5 space-y-2">
                        ${snap.docs.map(lDoc => {
                            const l = lDoc.data();
                            return `<div class="p-3 bg-slate-900/50 rounded-lg flex justify-between font-mono text-[10px]">
                                <span><b class="text-[#D4AF37]">${l.targetUser}:</b> ${l.action}</span>
                                <span class="text-slate-600">${formatDate(l.timestamp)}</span>
                            </div>`;
                        }).join('')}</div>`;
                });
            }

            if (currentTab === 'supportTickets') {
                onSnapshot(query(collection(db, "supportTickets"), orderBy("lastTimestamp", "desc")), snap => {
                    container.innerHTML = `<div class="grid grid-cols-3 gap-6">${snap.docs.map(tDoc => {
                        const t = tDoc.data();
                        return `<div onclick="adminOpenChat('${tDoc.id}', '${t.userName}')" class="glass-card p-6 rounded-[2rem] cursor-pointer flex justify-between items-center hover:bg-slate-800 transition-all">
                            <div><p class="font-black text-white">${t.userName}</p><p class="text-[10px] text-slate-500">${t.lastMessage}</p></div>
                            ${t.unreadAdminCount > 0 ? `<span class="bg-rose-600 px-2 py-0.5 rounded-full text-[10px] animate-pulse">NEW</span>` : ''}
                        </div>`;
                    }).join('')}</div>`;
                });
            }
        };

        window.adjustBalance = async (uid, name) => {
            const amt = prompt(`Adjust Balance for ${name}:\n(Use + to add, - to remove)`);
            if (amt === null || amt === "" || isNaN(amt)) return;

            try {
                const parsedAmt = parseFloat(amt);
                const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
                if (!accQ.empty) {
                    await updateDoc(doc(db, "accounts", accQ.docs[0].id), { 
                        availableBalance: increment(parsedAmt), 
                        totalBalance: increment(parsedAmt) 
                    });
                }
                await updateDoc(doc(db, "users", uid), { balance: increment(parsedAmt) });
                await logActivity(name, `BALANCE ADJUSTMENT: ${parsedAmt > 0 ? '+' : ''}${parsedAmt}`);
                alert("Success");
            } catch (err) { alert("Error updating balance."); }
        };

        window.previewIRS = () => {
            const uid = document.getElementById('forge-user').value;
            const type = document.getElementById('forge-type').value;
            const amt = document.getElementById('forge-amt').value;
            const u = users.find(x => x.id === uid);
            document.getElementById('irs-c-id').innerText = "TB-" + Math.floor(Math.random()*900000);
            document.getElementById('irs-c-name').innerText = u.fullName;
            document.getElementById('irs-c-val').innerText = Number(amt).toLocaleString();
            const map = { TAX_CLEARANCE: "Tax Clearance", IMF_RELEASE: "IMF Release", COURT_ORDER: "Court Order" };
            document.getElementById('irs-c-title').innerText = map[type].toUpperCase();
            document.getElementById('irs-c-reason').innerText = map[type].toLowerCase();
            document.getElementById('irs-preview-wrap').classList.remove('hidden');
        };

        window.downloadIRS = () => {
            html2canvas(document.getElementById('irs-capture'), { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `TRUST_BANK_DOC_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            });
        };

        window.adminOpenChat = (uid, name) => {
            if (messagesUnsubscribe) messagesUnsubscribe();
            activeChatUid = uid;
            const dock = document.getElementById('admin-floating-dock');
            dock.style.display = 'flex';
            dock.classList.remove('minimized');
            document.getElementById('dock-user-name').innerText = name;
            document.getElementById('dock-initial').innerText = name.charAt(0);
            updateDoc(doc(db, "supportTickets", uid), { unreadAdminCount: 0 }).catch(() => {});

            messagesUnsubscribe = onSnapshot(query(collection(db, "supportTickets", uid, "messages"), orderBy("timestamp", "asc")), snap => {
                const flow = document.getElementById('dock-msg-flow');
                flow.innerHTML = snap.docs.map(d => {
                    const m = d.data(); const isAdmin = m.senderRole === 'admin';
                    return `<div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'}"><div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-user'}">${m.text}</div></div>`;
                }).join('');
                flow.scrollTop = flow.scrollHeight;
            });
        };

        window.adminSendReply = async () => {
            const input = document.getElementById('dock-reply-input');
            const text = input.value.trim();
            if (!text || !activeChatUid) return;
            input.value = "";
            await addDoc(collection(db, "supportTickets", activeChatUid, "messages"), { text, senderRole: 'admin', timestamp: serverTimestamp() });
            await updateDoc(doc(db, "supportTickets", activeChatUid), { lastMessage: text, lastTimestamp: serverTimestamp(), unreadUserCount: increment(1) });
        };

        window.toggleDock = () => document.getElementById('admin-floating-dock').classList.toggle('minimized');
        window.closeDock = (e) => { e.stopPropagation(); if(messagesUnsubscribe) messagesUnsubscribe(); document.getElementById('admin-floating-dock').style.display = 'none'; };

        window.processTx = async (coll, id, status) => {
            const docRef = doc(db, coll, id);
            const snap = await getDoc(docRef);
            const d = snap.data();
            const uRef = doc(db, "users", d.uid || id);
            const uSnap = await getDoc(uRef);
            const name = uSnap.data().fullName;

            if (status === 'DECLINED') {
                const r = prompt("Reason:");
                await updateDoc(docRef, { status: 'DECLINED', declineReason: r });
                await logActivity(name, `DECLINED ${coll.toUpperCase()}: ${r}`);
            } else {
                if(coll !== 'kyc') {
                    const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", d.uid)));
                    const accRef = doc(db, "accounts", accQ.docs[0].id);
                    let change = d.amount; if(coll !== 'deposits') change = -d.amount;
                    await updateDoc(accRef, { availableBalance: increment(change), totalBalance: increment(change) });
                    await updateDoc(uRef, { balance: increment(change) });
                }
                await updateDoc(docRef, { status: 'APPROVED' });
                if(coll === 'kyc') await updateDoc(uRef, { kycStatus: 'VERIFIED' });
                await logActivity(name, `APPROVED ${coll.toUpperCase()}`);
            }
            renderData();
        };

        onSnapshot(collection(db, "supportTickets"), snap => {
            let total = 0; snap.docs.forEach(d => total += (d.data().unreadAdminCount || 0));
            const badge = document.getElementById('global-unread');
            if(badge) {
                if(total > 0) { badge.innerText = total; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            }
        });

        document.getElementById('logout-btn').onclick = () => auth.signOut();
        loadTab('dashboard');
    </script>
</body>
</html>
