<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 pb-32">
    <div id="header-container"></div>
    
    <main class="max-w-md mx-auto px-6 pt-8 space-y-6">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" placeholder="Search description..." class="w-full pl-12 bg-white">
        </div>

        <div id="transaction-list" class="space-y-4">
            <!-- Data Hydrates Here -->
        </div>
    </main>

    <div id="nav-container"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { renderHeader, renderBottomNav, renderEmptyState, renderStatusBadge } from './components.js';
        import { formatCurrency, formatDate } from './utils.js';

        document.getElementById('header-container').innerHTML = renderHeader('Activity', true);
        document.getElementById('nav-container').innerHTML = renderBottomNav('transactions');

        auth.onAuthStateChanged(user => {
            if (!user) return;

            const collections = ["transactions", "deposits", "withdrawals", "transfers"];
            let combinedData = [];
            let searchTerm = "";

            collections.forEach(coll => {
                onSnapshot(query(collection(db, coll), where("uid", "==", user.uid)), (snap) => {
                    combinedData = combinedData.filter(item => item._coll !== coll);
                    snap.forEach(doc => {
                        const d = doc.data();
                        combinedData.push({ ...d, id: doc.id, _coll: coll, sortDate: d.timestamp || d.createdAt });
                    });
                    render();
                });
            });

            document.getElementById('search-input').oninput = (e) => {
                searchTerm = e.target.value.toLowerCase();
                render();
            };

            const render = () => {
                const container = document.getElementById('transaction-list');
                const filtered = combinedData
                    .filter(t => (t.description || t.type || t._coll).toLowerCase().includes(searchTerm))
                    .sort((a, b) => (b.sortDate?.seconds || 0) - (a.sortDate?.seconds || 0));

                if (filtered.length === 0) {
                    container.innerHTML = renderEmptyState("No results found.");
                    return;
                }

                container.innerHTML = filtered.map(t => {
                    const isCredit = t.direction === 'credit' || t._coll === 'deposits';
                    const status = t.status || 'SUCCESSFUL';
                    return `
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 flex justify-between items-center shadow-sm">
                            <div>
                                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">${t.type || t._coll.slice(0, -1)}</p>
                                <p class="font-bold text-[#002147]">${t.description || 'Banking Transaction'}</p>
                                <p class="text-[10px] text-slate-400 mt-1">${formatDate(t.sortDate)}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-sm ${isCredit ? 'text-emerald-500' : 'text-[#002147]'}">
                                    ${isCredit ? '+' : '-'}${formatCurrency(t.amount)}
                                </p>
                                ${renderStatusBadge(status)}
                            </div>
                        </div>
                    `;
                }).join('');
            };
        });
    </script>
</body>
</html>
